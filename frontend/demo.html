<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studiekompas — widget preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #EFEAE0;
      color: #26241F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .placeholder-site {
      max-width: 640px;
      padding: 60px 40px;
      text-align: center;
    }
    .placeholder-site h1 {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      margin-bottom: 12px;
    }
    .placeholder-site p {
      color: #6B6558;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="placeholder-site">
    <h1>UNLP — voorbeeldpagina</h1>
    <p>
      Dit is een lege pagina om de Studiekompas-widget in isolatie te testen.
      Klik rechtsonder op de cirkel om de chat te openen.
    </p>
  </div>

  <script src="widget.js"></script>
  <studiekompas-widget api-url="http://localhost:8000"></studiekompas-widget>
</body>
</html>
